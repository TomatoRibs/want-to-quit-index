<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我想跑路指数 · 一份关于离职意愿的自检</title>
<meta name="description" content="六组问题，六十个选项，六分钟。量一量你现在有多想跑路。全部计算在浏览器里完成，不联网。">
<style>
  :root{
    --paper:#FAF7F1;
    --paper-2:#F2ECE1;
    --ink:#17140F;
    --ink-2:#4A4238;
    --ink-3:#6E655A;
    --rule:#DFD6C7;
    --seal:#9E3B26;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#E7DCC9}

  /* ---------- 顶栏 ---------- */
  .topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
  .topbar-in{max-width:920px;margin:0 auto;padding:14px 40px 12px}
  .track{height:2px;background:var(--rule);position:relative;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .topbar-row{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:9px;font-size:13px;color:var(--ink-3);letter-spacing:.02em;
  }
  .topbar-row b{font-weight:500;color:var(--ink-2)}

  /* ---------- 版心 ---------- */
  .layout{
    max-width:920px;margin:0 auto;padding:0 40px;
    display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:56px;align-items:start;
  }
  main{min-width:0;padding:60px 0 96px}
  .margin{position:sticky;top:92px;padding-top:66px;font-size:13px;line-height:1.95;color:var(--ink-3)}
  .margin p{margin:0 0 18px}
  .margin .mh{font-size:12.5px;letter-spacing:.08em;margin-bottom:8px}

  /* ---------- 首屏 ---------- */
  .intro{min-height:calc(100vh - 210px);display:flex;flex-direction:column;justify-content:center}
  .intro h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(28px,3.4vw,38px);line-height:1.46;letter-spacing:.01em;
    margin:0 0 26px;text-wrap:balance;
  }
  .nw{white-space:nowrap}
  .intro .lede{font-size:17px;line-height:1.9;color:var(--ink-2);margin:0 0 34px;text-wrap:pretty}
  .facts{
    display:flex;flex-wrap:wrap;gap:10px 28px;font-size:14px;color:var(--ink-3);
    padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:30px;
  }
  .facts b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
  .fine{font-size:13.5px;line-height:1.95;color:var(--ink-3);margin:0 0 38px;text-wrap:pretty}

  /* ---------- 静心仪式 ---------- */
  .ritual h2{font-family:var(--serif);font-size:clamp(24px,3vw,31px);font-weight:600;line-height:1.45;margin:0 0 16px}
  .ritual .lede{font-size:16.5px;line-height:1.9;color:var(--ink-2);margin:0 0 34px;text-wrap:pretty}
  .rsteps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:15px}
  .rsteps li{display:flex;gap:15px;font-size:15.5px;line-height:1.75;color:var(--ink-2)}
  .rsteps .n{font-family:var(--serif);font-size:17px;color:var(--seal);flex:none;width:1.1em;line-height:1.65}
  .breath{
    width:188px;height:188px;border-radius:50%;border:1px solid #D6C9B2;
    margin:38px auto 26px;position:relative;display:grid;place-items:center;background:var(--paper);
  }
  .breath .disc{
    position:absolute;inset:0;border-radius:50%;background:#E7DCC6;
    transform:scale(.8);animation:breathe 5s cubic-bezier(.42,0,.58,1) infinite;
  }
  @keyframes breathe{0%{transform:scale(.8)}40%{transform:scale(1)}100%{transform:scale(.8)}}
  .breath .ph{position:relative;z-index:2;font-family:var(--serif);font-size:16px;color:#6B4B3C;letter-spacing:.22em;text-indent:.22em}
  .cd{text-align:center;font-size:13.5px;color:var(--ink-3);margin:0 0 30px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .rt-actions{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-top:26px;border-top:1px solid var(--rule)}
  .rt-skip{font-size:13.5px;color:var(--ink-3);background:none;border:0;padding:10px 0;cursor:pointer;font:inherit;font-size:13.5px;border-bottom:1px solid transparent}
  .rt-skip:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* ---------- 题目 ---------- */
  h2.qtitle{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(23px,2.9vw,30px);line-height:1.5;letter-spacing:.01em;
    margin:0 0 14px;text-wrap:pretty;
  }
  .qhint{font-size:15px;line-height:1.88;color:var(--ink-3);margin:0 0 32px;text-wrap:pretty}

  .glabel{
    font-size:14px;color:var(--ink);letter-spacing:.04em;
    margin:40px 0 0;display:flex;justify-content:space-between;align-items:baseline;
  }
  .glabel .n{color:var(--ink-3);font-size:12.5px;letter-spacing:0}
  .glabel:first-of-type{margin-top:6px}

  .opts{display:block}
  .opt{
    display:flex;gap:15px;align-items:flex-start;padding:15px 0 14px;
    border-bottom:1px solid var(--rule);cursor:pointer;transition:background .18s;
  }
  .opt:hover{background:var(--paper-2)}
  .opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .dot{
    flex:none;width:15px;height:15px;margin-top:7px;border:1px solid #9B9083;border-radius:50%;
    transition:all .18s;position:relative;background:var(--paper);
  }
  .dot.sq{border-radius:1px}
  .txt{font-size:15.5px;line-height:1.75;color:var(--ink-2);transition:color .18s;padding-right:8px}
  .opt:hover .txt,.opt.is-on .txt{color:var(--ink)}
  .opt.is-on .dot{background:var(--ink);border-color:var(--ink)}
  .opt.is-on .dot::after{
    content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--paper);
  }
  .opt.is-on .dot.sq::after{
    left:4.5px;top:2px;width:4px;height:7px;border-radius:0;background:none;
    border-right:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(42deg);
  }
  .opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-2px;background:var(--paper-2)}

  /* ---------- 动作 ---------- */
  .actions{
    display:flex;align-items:center;gap:22px;margin-top:44px;padding-top:26px;
    border-top:1px solid var(--rule);flex-wrap:wrap;
  }
  .actions .spacer{flex:1}
  .btn{
    font:inherit;font-size:15.5px;letter-spacing:.02em;padding:13px 28px;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    cursor:pointer;border-radius:1px;transition:all .2s;
  }
  .btn:hover{background:var(--seal);border-color:var(--seal)}
  .btn:disabled{background:none;border-color:var(--rule);color:#A99F92;cursor:not-allowed}
  .btn-quiet{
    font:inherit;font-size:14.5px;padding:10px 0;border:0;border-bottom:1px solid transparent;
    background:none;color:var(--ink-3);cursor:pointer;transition:all .18s;letter-spacing:.02em;
  }
  .btn-quiet:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* ---------- 报告 ---------- */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding-bottom:34px;border-bottom:1px solid var(--rule)}
  .score{font-family:var(--serif);font-weight:600;line-height:.88;font-variant-numeric:tabular-nums}
  .score .lab{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-3);letter-spacing:.1em;margin:0 0 14px;line-height:1.4}
  .score b{font-size:clamp(84px,12.5vw,124px);font-weight:600;letter-spacing:-.02em;display:block}
  .score span{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:14px;letter-spacing:.06em}
  .hero-r{max-width:26em}
  .verdict{font-size:16.5px;line-height:1.92;color:var(--ink-2);margin:14px 0 0}
  .seal{
    width:88px;height:88px;border:2px solid var(--seal);
    display:grid;grid-template-columns:1fr 1fr;place-items:center;
    transform:rotate(-6.5deg);color:var(--seal);
    font-family:var(--serif);font-size:23px;font-weight:600;line-height:1;
    letter-spacing:1px;position:relative;opacity:.9;margin-bottom:18px;
  }
  .seal::after{content:"";position:absolute;inset:4px;border:1px solid var(--seal);opacity:.45}
  .seal.two{grid-template-columns:1fr;font-size:30px}

  .sec{margin-top:52px}
  .sec-h{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.03em;margin:0 0 20px;color:var(--ink)}
  .sec-h em{font-style:normal;font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-left:12px;letter-spacing:.04em}

  .metric{display:grid;grid-template-columns:88px 1fr 46px;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule)}
  .metric:first-of-type{border-top:1px solid var(--rule)}
  .m-name{font-size:15px;color:var(--ink-2)}
  .m-track{height:2px;background:var(--rule);position:relative}
  .m-track i{display:block;height:100%;width:0;background:var(--ink);transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .m-val{font-family:var(--serif);font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
  .readout{font-size:16px;line-height:1.92;color:var(--ink-2);margin:22px 0 0;text-wrap:pretty}
  .readout b{color:var(--ink);font-weight:600}

  .dc{display:grid;grid-template-columns:104px 1fr 30px;gap:18px;align-items:center;padding:11px 0}
  .dc-name{font-size:15px;color:var(--ink-3)}
  .dc.on .dc-name{color:var(--ink);font-weight:600}
  .dc-line{height:1px;background:var(--rule);position:relative}
  .dc-line i{display:block;height:3px;width:0;background:#B4A997;margin-top:-1px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .dc.on .dc-line i{background:var(--seal)}
  .dc-n{font-family:var(--serif);font-size:17px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .dc.on .dc-n{color:var(--ink)}

  .items{margin:18px 0 0;padding:0;list-style:none}
  .items li{font-size:15.5px;line-height:1.85;color:var(--ink-2);padding:9px 0 9px 17px;position:relative;border-bottom:1px solid #EBE4D8}
  .items li::before{content:"";position:absolute;left:0;top:19px;width:6px;height:1px;background:var(--seal)}

  .quad-wrap{display:grid;grid-template-columns:184px 1fr;gap:34px;align-items:start}
  .quad{position:relative;width:184px;height:184px;border:1px solid var(--rule)}
  .quad .h,.quad .v{position:absolute;background:var(--rule)}
  .quad .h{left:0;right:0;top:50%;height:1px}
  .quad .v{top:0;bottom:0;left:50%;width:1px}
  .quad .pt{position:absolute;width:9px;height:9px;background:var(--seal);border-radius:50%;transform:translate(-50%,-50%);transition:all .7s cubic-bezier(.2,.7,.2,1)}
  .qt h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 12px;line-height:1.5}
  .qt p{font-size:15.5px;line-height:1.9;color:var(--ink-2);margin:0;text-wrap:pretty}
  .qcap{font-size:12.5px;color:var(--ink-3);margin:11px 0 0;letter-spacing:.02em;line-height:1.7;max-width:220px}

  .next{background:var(--ink);color:var(--paper);padding:30px 32px 32px;margin-top:52px}
  .next .k{font-size:12.5px;letter-spacing:.14em;color:#B9AE9E;margin-bottom:16px}
  .next h3{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.55;margin:0 0 16px;color:#FBF8F2}
  .next ol{margin:0;padding-left:22px;color:#D9D0C2;counter-reset:step 1;list-style:none}
  .next li{font-size:15px;line-height:1.85;margin-bottom:9px;position:relative}
  .next li::before{counter-increment:step;content:counter(step) ".";position:absolute;left:-22px;color:#9E9384;font-variant-numeric:tabular-nums}
  .next li:last-child{margin-bottom:0}

  .warn{margin-top:26px;padding-left:17px;border-left:2px solid var(--seal);font-size:15px;line-height:1.9;color:var(--ink-2)}

  .prep-list{margin:0;padding:0;list-style:none}
  .prep-list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #EBE4D8;font-size:15.5px;line-height:1.7}
  .prep-list .mk{flex:none;width:13px;height:13px;margin-top:8px;border:1px solid #B4A997;border-radius:1px}
  .prep-list .has .mk{background:var(--ink);border-color:var(--ink);position:relative}
  .prep-list .has .mk::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;border-right:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(42deg)}
  .prep-list .no{color:var(--ink-3)}

  .foot{
    margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);
    display:flex;flex-wrap:wrap;gap:12px 26px;align-items:baseline;font-size:13px;color:var(--ink-3);
  }
  .foot .id{font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .foot .act{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
  .hint-msg{font-size:13px;color:var(--seal)}

  /* ---------- FAQ ---------- */
  .faq{margin-top:76px}
  .faq h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 10px}
  .faq > p{font-size:14.5px;color:var(--ink-3);margin:0}
  details{border-bottom:1px solid var(--rule)}
  details:first-of-type{border-top:1px solid var(--rule);margin-top:24px}
  summary{
    cursor:pointer;padding:17px 0;font-size:16px;color:var(--ink);list-style:none;
    display:flex;gap:14px;justify-content:space-between;align-items:baseline;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"＋";color:var(--ink-3);font-size:14px;flex:none}
  details[open] summary::after{content:"－"}
  details[open] summary{padding-bottom:10px}
  details .ans{font-size:15.5px;line-height:1.92;color:var(--ink-2);padding:0 0 20px;margin:0;text-wrap:pretty}

  .coda{margin-top:70px;padding-top:20px;border-top:1px solid var(--rule);font-size:13px;line-height:2;color:var(--ink-3)}

  .fade{animation:fade .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:0;padding:0}
    .topbar-in{padding:12px 22px 10px}
    main{padding:40px 22px 72px}
    .intro{min-height:0}
    .margin{display:none}
    .hero{grid-template-columns:1fr;gap:24px}
    .quad-wrap{grid-template-columns:1fr;gap:34px}
    .quad{width:100%;max-width:220px;height:auto;aspect-ratio:1/1}
    .metric{grid-template-columns:74px 1fr 40px;gap:13px}
    .dc{grid-template-columns:92px 1fr 26px;gap:13px}
    .actions{gap:16px}
    .btn{width:100%;text-align:center;order:-1}
    .foot .act{margin-left:0}
    .breath{width:160px;height:160px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .breath .disc{transform:scale(.92)}
  }
  @media print{
    body{background:#fff}
    .topbar,.margin,.foot .act,summary::after,.rt-actions{display:none!important}
    .layout{display:block;max-width:none;padding:0}
    main{padding:0}
    .next{background:#fff;color:#000;border:1px solid #000}
    .next h3,.next .k,.next ol{color:#000}
    .quad{page-break-inside:avoid}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="track"><i id="trackFill"></i></div>
    <div class="topbar-row">
      <span id="barLeft">我想跑路指数</span>
      <span><b id="barRight"></b></span>
    </div>
  </div>
</div>

<div class="layout">
  <main id="main"></main>
  <aside class="margin" id="margin"></aside>
</div>

<script>
(function () {
  "use strict";

  /* ==================== 题库 ==================== */
  /* 每一项都写成一个人自己能说出口的话。不写抽象的维度名。 */

  var STAGE = {
    key: "stage", step: "起点", type: "single",
    title: "你现在站在哪一步？",
    hint: "这一项不单独算分，但它决定后面的话怎么跟你说。照实选。",
    opts: [
      { t: "偶尔觉得哪里不对，还没认真想过", v: 0 },
      { t: "已经在留意机会了，简历还没投", v: 2 },
      { t: "在聊，在面，只是还没谈成", v: 4 },
      { t: "心里其实定了，缺一个时点", v: 6 }
    ]
  };

  var FREQ = {
    key: "freq", step: "频率", type: "single",
    title: "最近三个月，「不想干了」多久冒出来一次？",
    hint: "按平时的样子选。别拿上周三那个最难受的晚上当标准。",
    opts: [
      { t: "基本没有。偶尔闪一下，第二天就忘", v: 0 },
      { t: "一两周一次，都跟具体的人或事有关", v: 6 },
      { t: "几乎天天路过这个念头，手上的活还照做", v: 12 },
      { t: "它不算念头了，算预期", v: 18 }
    ]
  };

  var BURDENS = {
    key: "burden", step: "消耗", type: "multi",
    title: "什么在一直耗你？",
    hint: "可以一项都不勾。别只挑最狠的，天天发生的那种才最耗人。",
    groups: [
      {
        g: "钱与长进",
        items: [
          "我拿的钱，和我实际扛的事不匹配",
          "我的市场价这几年在原地，只有工龄在涨",
          "做的全是熟练活，学不到能带走的东西",
          "我看不清三年后自己在这里是什么位置",
          "加薪和晋升的规则，从来没人跟我说明白",
          "我干出来的东西，功劳记在别人名下"
        ]
      },
      {
        g: "人与权",
        items: [
          "主管只会用我，不会带我",
          "我提的方案总被推翻，绕一圈又回到原样",
          "答应过的事，一次都没兑现",
          "出了问题先找人负责，不先找原因",
          "我得一直猜上面到底什么意思",
          "出事的时候，团队里没人会替我说一句话"
        ]
      },
      {
        g: "时间与边界",
        items: [
          "会议吃掉大半时间，正事只能靠加班补",
          "下班之后的消息，默认是要回的",
          "通勤拿走了我一天里状态最好的两小时",
          "流程和审批，比事情本身还费时间",
          "派给我的活，长期超过一个人正常能做完的量",
          "休假也随时在线，等于没休"
        ]
      },
      {
        g: "意义与身体",
        items: [
          "我不相信这份工作真的帮到了谁",
          "这里做事的方式，和我信的东西是冲突的",
          "下班之后我需要很久才能变回我自己",
          "在这里我得一直演一个不是我的人",
          "事情做成什么样，我已经没感觉了",
          "我的身体已经先替我投了反对票"
        ]
      }
    ]
  };

  var SIGNALS = {
    key: "signal", step: "信号", type: "multi",
    title: "你的念头、身体和习惯，说了什么？",
    hint: "只勾已经发生过的。别勾「可能会」。这一组在分数里分量不轻，它记的都是发生过的事，不用你评价自己。",
    groups: [
      {
        g: "念头",
        items: [
          "想到辞职两个字，我先松了口气，才想起来害怕",
          "我会无目的地刷招聘软件",
          "我暗暗算过自己还能撑几个月",
          "看到别人离职，我第一反应是羡慕",
          "我在心里给自己设了一个「最多到什么时候」",
          "周日一到下午，我就开始提前低落"
        ]
      },
      {
        g: "身体",
        items: [

  /* ==================== 状态 ==================== */
  var state = { step: INTRO, stage: null, freq: null, support: null, burden: [], signal: [], prep: [] };
  var serial = makeSerial();
  var breathTimer = null;

  var main = document.getElementById("main");
  var margin = document.getElementById("margin");

  function makeSerial() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };

  /* ==================== 首屏 ==================== */

  /* ==================== 选项 ==================== */
  function singleBlock(q) {
    var h = '<div class="opts">';
    q.opts.forEach(function (o) {

      h += '<label class="opt' + (on ? " is-on" : "") + '">' +
        '<input type="radio" name="' + q.key + '" value="' + o.v + '"' + (on ? " checked" : "") + ">" +
        '<span class="dot"></span><span class="txt">' + esc(o.t) + "</span></label>";
    });
    return h + "</div>";
  }

  function multiBlock(q) {
    var h = "";
    q.groups.forEach(function (grp, gi) {
      var cnt = grp.items.filter(function (_, ii) { return state[q.key].indexOf(gi + ":" + ii) > -1; }).length;
      h += '<div class="glabel"><span>' + esc(grp.g) + "</span>" +
        (cnt ? '<span class="n">' + cnt + "</span>" : "") + "</div><div class='opts'>";
      grp.items.forEach(function (it, ii) {
        var k = gi + ":" + ii, on = state[q.key].indexOf(k) > -1;

    });

  }

  /* ==================== 步骤 ==================== */
  function renderStep() {
    var q = STEPS[state.step];
    var isLast = state.step === STEPS.length - 1;
    var need = q.type === "single";
    var ok = !need || state[q.key] !== null;

    main.innerHTML =
      '<section class="fade">' +
      '<h2 class="qtitle">' + esc(q.title) + "</h2>" +
      '<p class="qhint">' + esc(q.hint) + "</p>" +
      (need ? singleBlock(q) : multiBlock(q)) +
      '<div class="actions">' +
      (state.step === 0 ? "<span></span>" : '<button class="btn-quiet" id="backBtn">上一组</button>') +
      '<span class="spacer"></span>' +
      '<button class="btn" id="nextBtn"' + (ok ? "" : " disabled") + ">" +
      (isLast ? "看结果" : "继续") + "</button></div>" +
      "</section>";

      inp.addEventListener("change", function () {
        state[q.key] = parseInt(inp.value, 10);

          o.classList.toggle("is-on", o === inp.parentNode);
        });
        document.getElementById("nextBtn").disabled = false;
        renderChrome();
      });
    });

    Array.prototype.forEach.call(main.querySelectorAll("input[type=checkbox]"), function (inp) {
      inp.addEventListener("change", function () {
        var k = inp.getAttribute("data-key"), arr = state[q.key], i = arr.indexOf(k);
        if (inp.checked && i < 0) arr.push(k);
        if (!inp.checked && i > -1) arr.splice(i, 1);
        inp.parentNode.classList.toggle("is-on", inp.checked);

        var wrap = inp.parentNode.parentNode;
        var gl = wrap.previousElementSibling;
        if (gl && gl.classList.contains("glabel")) {
          var cnt = wrap.querySelectorAll(".opt.is-on").length;
          var n = gl.querySelector(".n");
          if (cnt && !n) gl.insertAdjacentHTML("beforeend", '<span class="n">' + cnt + "</span>");
          else if (cnt && n) n.textContent = cnt;
          else if (!cnt && n) n.remove();
        }
        renderChrome();
      });
    });

    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", function () {
      state.step -= 1; render(); window.scrollTo({ top: 0 });
    });

  /* ==================== 计算 ==================== */
  function compute() {
    var bc = state.burden.length, sc = state.signal.length;
    var raw = state.stage + state.freq +
      Math.min(bc * W.burdenEach, W.burdenCap) +
      Math.min(sc * W.signalEach, W.signalCap) + state.support;
    var index = Math.max(0, Math.min(100, Math.round(raw / W.rawMax * 100)));

    var axes = {
      freq: Math.round((state.stage + state.freq) / 24 * 100),
      burden: Math.round(Math.min(bc * W.burdenEach, W.burdenCap) / W.burdenCap * 100),
      signal: Math.round(Math.min(sc * W.signalEach, W.signalCap) / W.signalCap * 100),
      iso: Math.round(state.support / 12 * 100)
    };
    var prep = Math.round(state.prep.length / 6 * 100);

    var level = LEVELS[LEVELS.length - 1];
    for (var i = 0; i < LEVELS.length; i++) { if (index <= LEVELS[i].max) { level = LEVELS[i]; break; } }

    var maxAxis = "burden", maxVal = -1;
    ["burden", "signal", "freq", "iso"].forEach(function (k) {
      if (axes[k] > maxVal) { maxVal = axes[k]; maxAxis = k; }
    });

    var domains = BURDENS.groups.map(function (g, gi) {
      return { name: g.g, n: g.items.filter(function (_, ii) { return state.burden.indexOf(gi + ":" + ii) > -1; }).length };
    });
    var topDomain = 0;
    domains.forEach(function (d, i) { if (d.n > domains[topDomain].n) topDomain = i; });

    var topItems = state.burden.map(function (k) {
      var p = k.split(":"); return BURDENS.groups[+p[0]].items[+p[1]];
    }).slice(0, 3);

    return {
      index: index, axes: axes, prep: prep, level: level, maxAxis: maxAxis,
      quadKey: (index >= 55 ? "h" : "l") + (prep >= 50 ? "h" : "l"),
      domains: domains, topDomain: topDomain, topItems: topItems,
      burdenN: bc, signalN: sc, prepN: state.prep.length
    };
  }

  /* ==================== 报告 ==================== */
  function renderReport(fromHash) {
    var r = compute(), q = QUAD[r.quadKey];
    var chars = r.level.name.split("");

    var h = '<section class="fade">';

    h += '<div class="hero">' +
      '<div class="score"><span class="lab">我想跑路指数</span><b>' + r.index + "</b><span>满分 100</span></div>" +

      '<div class="seal' + (chars.length === 2 ? " two" : "") + '">' +
      chars.map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("") + "</div>" +
      '<p class="verdict">' + r.level.text + "</p></div></div>";

    h += '<div class="sec"><h3 class="sec-h">四项指标<em>越高越需要处理</em></h3>' +
      metric("想跑路的频次", r.axes.freq) +
      metric("消耗总量", r.axes.burden) +
      metric("身体与行为", r.axes.signal) +
      metric("支持缺口", r.axes.iso) +
      '<p class="readout">最突出的是 <b>' +
      { freq: "想跑路的频次", burden: "消耗总量", signal: "身体与行为", iso: "支持缺口" }[r.maxAxis] +
      "</b>。" + AXIS_READ[r.maxAxis] + "</p></div>";

    h += '<div class="sec"><h3 class="sec-h">消耗结构<em>勾了 ' + r.burdenN + " 项</em></h3>";
    if (r.burdenN === 0) {
      h += '<p class="readout" style="margin-top:0">这一组你一项都没勾。认真选出来是这个结果，它也是一个答案。</p>';
    } else {
      r.domains.forEach(function (d, i) {
        h += '<div class="dc' + (i === r.topDomain && d.n > 0 ? " on" : "") + '">' +
          '<span class="dc-name">' + esc(d.name) + "</span>" +

      h += '<p class="readout">最重的一块是 <b>' + esc(r.domains[r.topDomain].name) + "</b>，勾了 " +
        r.domains[r.topDomain].n + " 项。真正决定你走不走的，是这一格，不是那个两位数。</p>";
      if (r.topItems.length) {
        h += '<ul class="items">' + r.topItems.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
      }
    }
    h += "</div>";

    var px = Math.max(6, Math.min(94, 50 + (r.prep - 50) * 0.88));
    var py = Math.max(6, Math.min(94, 50 - (r.index - 50) * 0.88));
    h += '<div class="sec"><h3 class="sec-h">你落在哪一格</h3>' +
      '<div class="quad-wrap"><div><div class="quad">' +
      '<div class="h"></div><div class="v"></div>' +
      '<div class="pt" style="left:' + px.toFixed(1) + '%;top:' + py.toFixed(1) + '%"></div></div>' +
      '<p class="qcap">横轴：越往右，退路越多<br>纵轴：越往上，指数越高</p></div>' +
      '<div class="qt"><h3>' + esc(q.title) + "</h3><p>" + esc(q.body) + "</p></div></div></div>";

    h += '<div class="next"><div class="k">下一步 · 按顺序做，别同时开工</div>' +
      "<h3>" + esc(q.actions[0]) + "</h3><ol>";
    for (var i = 1; i < q.actions.length; i++) h += "<li>" + esc(q.actions[i]) + "</li>";
    h += "</ol></div>";

    h += '<div class="sec"><h3 class="sec-h">退路<em>' + r.prepN + " / 6</em></h3>" +
      '<p class="readout" style="margin-top:0;margin-bottom:14px">这组不进压力分。它只回答一个问题：明天就走，你手上有多少缓冲。</p>' +
      '<ul class="prep-list">';
    PREP.groups[0].items.forEach(function (it, ii) {
      var has = state.prep.indexOf("0:" + ii) > -1;
      h += '<li class="' + (has ? "has" : "no") + '"><span class="mk"></span><span>' + esc(it) + "</span></li>";
    });
    h += "</ul>";

    if (r.axes.burden >= 60 && r.prep <= 33) {
      h += '<p class="warn"><b>单独说一句：</b>消耗高，退路薄。这种组合最难的地方在腾挪空间小。任何一个「不忍了」的决定，落地就变成钱的问题。先把缓冲垫攒出来。</p>';
    } else if (r.axes.iso >= 67) {
      h += '<p class="warn"><b>还有一件事。</b>支持缺口很大，上面所有判断都是你一个人在做的。哪怕只是把结果给一个信得过的人看一遍，也会不一样。说出口之后，它从「感觉」变成「一件事」。能处理的是后者。</p>';
    }
    h += "</div>";

    h += '<div class="foot"><span class="id">' + esc(serial) + "</span><span>" + fmtDate() + "</span>" +
      '<span class="act">' +
      '<button class="btn-quiet" id="copySum">复制摘要</button>' +
      '<button class="btn-quiet" id="copyLink">复制结果链接</button>' +
      '<button class="btn-quiet" id="printBtn">打印</button>' +
      '<button class="btn-quiet" id="resetBtn">重新开始</button>' +
      '<span class="hint-msg" id="copied"></span></span></div>';

    h += "</section>" + faqBlock();

    main.innerHTML = h;

    window.requestAnimationFrame(function () {
      Array.prototype.forEach.call(main.querySelectorAll(".m-track i,.dc-line i"), function (el) {
        el.style.width = el.getAttribute("data-w") + "%";
      });
    });

    document.getElementById("copySum").addEventListener("click", function () {
      var t = "我想跑路指数 · " + serial + "\n" +
        "我想跑路指数 " + r.index + " / 100（" + r.level.name + "）\n" +
        "最重的一块：" + r.domains[r.topDomain].name + "，勾了 " + r.domains[r.topDomain].n + " 项\n" +
        "频次 " + r.axes.freq + " · 消耗 " + r.axes.burden + " · 身体与行为 " + r.axes.signal + " · 支持缺口 " + r.axes.iso + "\n" +
        "退路 " + r.prepN + " / 6\n位置：" + q.title;
      copy(t, "已复制");
    });
    document.getElementById("copyLink").addEventListener("click", function () {
      copy(location.href.split("#")[0] + "#r=" + encodeState(), "已复制链接");
    });
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("resetBtn").addEventListener("click", function () {
      state = { step: INTRO, stage: null, freq: null, support: null, burden: [], signal: [], prep: [] };
      serial = makeSerial();
      render();
      try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
      window.scrollTo({ top: 0 });
    });

    if (fromHash) {
      var c = document.getElementById("copied");
      c.textContent = "已从链接还原";
      setTimeout(function () { c.textContent = ""; }, 3200);
    }
  }

  function metric(name, v) {
    return '<div class="metric"><span class="m-name">' + name + "</span>" +
      '<span class="m-track"><i data-w="' + v + '"></i></span>' +
      '<span class="m-val">' + v + "</span></div>";
  }

  function faqBlock() {
    var qs = [
      ["这个分数能决定我走不走吗？",
        "不能。它量的是这份工作现在从你身上拿走多少。同一个分，存款一年和存款一个月，意思完全不同。这就是退路单列一根轴的原因。真要决定，你需要一个安静的下午，不是一个两位数。"],
      ["我的答案会传到哪儿？",
        "哪儿也不去。页面没有后端，分数在你浏览器里算完就完了。唯一离开这台电脑的，是你自己点出来的那串网址，里面带着你的选项编号。收到链接的人能还原同一份报告。发之前看清发给谁。"],
      ["为什么压力分里不算退路？",
        "一算就混了。有退路让你敢走，不让你少痛。把退路反着扣进分数，等于说存了钱的人痛得轻。这话说不通。所以拆成两个数：一个说消耗，一个说你有多大空间。"],
      ["分数高，退路也多，听哪个？",
        "听日期的。这种组合最容易被拖住：反正随时能走，那今天先忍着。忍着忍着又是一年。你要的是一个写下来的日子。反过来，分高手少，顺序比勇气重要。先攒退路。"],
      ["隔一周再测，数不一样正常吗？",
        "正常。工作状态像天气，不像性格。跟同事吃了顿痛快的饭，分会掉。周日晚上翻开下周的会，分又涨回去。单次数字说明不了什么，连着测一个月看走势。一个月都在高位，那就是答案。"],
      ["为什么专门问身体和睡眠？",
        "因为身体不撒谎。人会给自己找台阶：最近项目忙，过了这阵就好。可入睡难、周日晚上胃疼、肩膀一直耸着，不配合你演戏。这组题权重不低，原因就在这儿。"]
    ];
    var h = '<section class="faq"><h2>几个容易被问到的</h2><p>尤其是「这个数到底算不算数」。</p>';
    qs.forEach(function (p) {
      h += "<details><summary>" + p[0] + "</summary><p class='ans'>" + p[1] + "</p></details>";
    });
    h += '<p class="coda">这份东西不是诊断，也不是咨询。它只把你说不清的感觉，整理成能读的条目。剩下的，慢慢来。</p>';
    return h + "</section>";
  }

  /* ==================== 复制 ==================== */
  function copy(text, msg) {
    var done = function () {
      var el = document.getElementById("copied");
      if (el) { el.textContent = msg; setTimeout(function () { el.textContent = ""; }, 2600); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fb(text, done); });
    } else fb(text, done);
  }
  function fb(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { window.prompt("手动复制：", text); }
    document.body.removeChild(ta);
  }

  /* ==================== 链接编解码 ==================== */
  function encodeState() {
    var f = function (arr) { return arr.map(function (k) { return k.replace(":", ""); }).join("-"); };
    return [state.stage, state.freq, state.support].join(".") + "_" +
      f(state.burden) + "_" + f(state.signal) + "_" + f(state.prep);
  }
  function decodeState(str) {
    try {
      var parts = str.split("_");
      if (parts.length < 4) return false;
      var s = parts[0].split(".").map(Number);
      if (s.some(isNaN)) return false;
      var back = function (seg) {
        return seg ? seg.split("-").map(function (v) { return v.charAt(0) + ":" + v.charAt(1); }) : [];
      };
      state.stage = s[0]; state.freq = s[1]; state.support = s[2];
      state.burden = back(parts[1]); state.signal = back(parts[2]); state.prep = back(parts[3]);
      return true;
    } catch (e) { return false; }
  }

  /* ==================== 主渲染 ==================== */
  function render() {
    stopBreath();
    renderChrome();
    if (state.step === INTRO) renderIntro();
    else if (state.step === RITUAL) renderRitual();
    else if (state.step === 6) renderReport(false);
    else renderStep();
  }

  var hash = location.hash || "";
  if (hash.indexOf("#r=") === 0 && decodeState(decodeURIComponent(hash.slice(3)))) {
    state.step = 6;
    renderChrome();
    renderReport(true);
  } else {
    render();
  }
})();
</script>
</body>
</html>
